            <!-- Course Modules & Exam Lab Grid -->
            <section class="space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-xs font-mono font-semibold uppercase tracking-wider text-slate-500 dark:text-zinc-400">
                  Core Modules & Practice Lab
                </h2>
                <span class="text-xs font-mono text-slate-400 dark:text-zinc-500">Click any card to open notes</span>
              </div>

              <div class="grid md:grid-cols-2 gap-4">
                ${MODULES.map(mod => {
                  const modDone = mod.sections.filter(s => state.completedSections.includes(`${mod.id}:${s.id}`)).length;
                  const modTotal = mod.sections.length;
                  const isComplete = modDone === modTotal;
                  return `
                    <div data-open-module="${mod.id}" class="module-card cursor-pointer p-5 rounded-2xl bg-white dark:bg-surface-card hover:border-emerald-500/50 border border-slate-200 dark:border-surface-border transition-all flex flex-col justify-between group">
                      <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                          <span class="px-2.5 py-0.5 rounded-md text-xs font-mono font-bold bg-slate-100 dark:bg-surface-elevated text-slate-800 dark:text-zinc-200 border border-slate-200 dark:border-surface-border">
                            ${mod.code}
                          </span>
                          <span class="text-[11px] font-mono ${isComplete ? 'text-emerald-600 dark:text-emerald-400 font-semibold' : 'text-slate-500 dark:text-zinc-400'}">
                            ${isComplete ? '✓ Completed' : `${modDone}/${modTotal} sections`}
                          </span>
                        </div>
                        <div class="text-[11px] font-mono text-slate-400 dark:text-zinc-500 mb-1">${mod.part}</div>
                        <h3 class="text-base font-bold text-slate-900 dark:text-zinc-100 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors mb-2">
                          ${mod.title}
                        </h3>
                        <p class="text-xs text-slate-600 dark:text-zinc-400 leading-relaxed mb-4">
                          ${mod.summary}
                        </p>
                      </div>
                      <div class="pt-3 border-t border-slate-100 dark:border-surface-border flex flex-wrap items-center justify-between gap-2">
                        <div class="flex flex-wrap gap-1.5">
                          ${mod.tags.slice(0, 3).map(t => `
                            <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-slate-50 dark:bg-surface-elevated text-slate-600 dark:text-zinc-400 border border-slate-200/80 dark:border-surface-border">${t}</span>
                          `).join('')}
                        </div>
                        <span class="text-xs font-mono text-emerald-600 dark:text-emerald-400 group-hover:translate-x-0.5 transition-transform">Open →</span>
                      </div>
                    </div>
                  `;
                }).join('')}

                <!-- Exam Lab Quiz Card -->
                <div id="open-quiz-card" class="cursor-pointer p-5 rounded-2xl bg-gradient-to-br from-emerald-500/10 via-white to-sky-500/10 dark:from-emerald-500/10 dark:via-surface-card dark:to-sky-500/10 hover:border-emerald-500/60 border border-emerald-500/30 transition-all flex flex-col justify-between group">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-3">
                      <span class="px-2.5 py-0.5 rounded-md text-xs font-mono font-bold bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30">
                        EXAM LAB
                      </span>
                      <span class="text-[11px] font-mono text-emerald-700 dark:text-emerald-400 font-semibold">
                        Score: ${stats.quizCorrect}/${QUIZ_QUESTIONS.length}
                      </span>
                    </div>
                    <div class="text-[11px] font-mono text-slate-500 dark:text-zinc-400 mb-1">Interactive Assessment</div>
                    <h3 class="text-base font-bold text-slate-900 dark:text-zinc-100 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors mb-2">
                      Written Law Practice Quiz (8 MCQs)
                    </h3>
                    <p class="text-xs text-slate-600 dark:text-zinc-400 leading-relaxed mb-4">
                      Test your mastery of Article 160, Ninth Schedule lists, Art 44 & 67, Royal Assent timelines, Section 3 Interpretation Act 1967, and <em>Ghazali v PP</em>.
                    </p>
                  </div>
                  <div class="pt-3 border-t border-emerald-500/20 flex items-center justify-between text-xs font-mono">
                    <span class="text-slate-600 dark:text-zinc-400">Instant explanations included</span>
                    <span class="text-emerald-600 dark:text-emerald-400 font-semibold group-hover:translate-x-0.5 transition-transform">Start Drill →</span>
                  </div>
                </div>
              </div>
            </section>
          </div>
        `;
      }

      function renderModuleView() {
        const mod = MODULES.find(m => m.id === state.activeModuleId) || MODULES[0];
        const modIdx = MODULES.findIndex(m => m.id === mod.id);
        const prevMod = modIdx > 0 ? MODULES[modIdx - 1] : null;
        const nextMod = modIdx < MODULES.length - 1 ? MODULES[modIdx + 1] : null;

        return `
          <div class="space-y-6 fade-in">
            <!-- Breadcrumb & Module Switcher -->
            <div class="flex flex-wrap items-center justify-between gap-3">
              <button id="back-dashboard-btn" type="button" class="inline-flex items-center gap-1.5 text-xs font-mono text-slate-500 dark:text-zinc-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
                <span>←</span>
                <span>Back to Dashboard</span>
              </button>
              <div class="flex items-center gap-1.5">
                ${MODULES.map(m => `
                  <button type="button" data-switch-mod="${m.id}" class="switch-mod-btn px-2.5 py-1 rounded-lg text-xs font-mono border transition-colors ${m.id === mod.id ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-700 dark:text-emerald-300 font-bold' : 'bg-white dark:bg-surface-card border-slate-200 dark:border-surface-border text-slate-500 dark:text-zinc-400 hover:border-slate-300'}">
                    ${m.code}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Module Header Card -->
            <div class="p-6 rounded-2xl bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border">
              <div class="flex flex-wrap items-center gap-2 mb-2">
                <span class="px-2.5 py-0.5 rounded text-xs font-mono font-bold bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 border border-emerald-500/20">${mod.code}</span>
                <span class="text-xs font-mono text-slate-500 dark:text-zinc-400">${mod.part}</span>
              </div>
              <h1 class="text-2xl font-bold text-slate-900 dark:text-zinc-100 mb-2">${mod.title}</h1>
              <p class="text-sm text-slate-600 dark:text-zinc-400 mb-4">${mod.summary}</p>
              <div class="flex flex-wrap gap-1.5">
                ${mod.tags.map(t => `
                  <span class="px-2.5 py-0.5 rounded-md text-[11px] font-mono bg-slate-100 dark:bg-surface-elevated text-slate-600 dark:text-zinc-300 border border-slate-200 dark:border-surface-border">${t}</span>
                `).join('')}
              </div>
            </div>

            <!-- Sections List -->
            <div class="space-y-5">
              ${mod.sections.map(sec => {
                const secKey = `${mod.id}:${sec.id}`;
                const isDone = state.completedSections.includes(secKey);
                return `
                  <article id="${sec.id}" class="p-6 rounded-2xl bg-white dark:bg-surface-card border ${isDone ? 'border-emerald-500/40' : 'border-slate-200 dark:border-surface-border'} transition-colors">
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                      <span class="text-[11px] font-mono font-semibold text-emerald-600 dark:text-emerald-400">${sec.badge}</span>
                      <button type="button" data-toggle-sec="${secKey}" class="toggle-sec-btn inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-mono border transition-colors ${isDone ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-700 dark:text-emerald-300' : 'bg-slate-50 dark:bg-surface-elevated border-slate-200 dark:border-surface-border text-slate-500 dark:text-zinc-400 hover:text-slate-900 dark:hover:text-zinc-200'}">
                        <span>${isDone ? '✓ Mastered' : '○ Mark as Mastered'}</span>
                      </button>
                    </div>
                    <h2 class="text-lg font-bold text-slate-900 dark:text-zinc-100 mb-4">${sec.heading}</h2>
                    <div>${sec.content}</div>
                  </article>
                `;
              }).join('')}
            </div>

            <!-- Bottom Module Navigation -->
            <div class="pt-4 flex flex-wrap items-center justify-between gap-3">
              ${prevMod ? `
                <button type="button" data-switch-mod="${prevMod.id}" class="switch-mod-btn px-4 py-2.5 rounded-xl text-xs font-mono bg-white dark:bg-surface-card hover:border-emerald-500/40 border border-slate-200 dark:border-surface-border text-slate-700 dark:text-zinc-300 transition-colors">
                  ← Previous: ${prevMod.code}
                </button>
              ` : '<div></div>'}

              ${nextMod ? `
                <button type="button" data-switch-mod="${nextMod.id}" class="switch-mod-btn px-4 py-2.5 rounded-xl text-xs font-mono bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition-colors">
                  Next Module: ${nextMod.code} →
                </button>
              ` : `
                <button id="go-exam-lab-btn" type="button" class="px-4 py-2.5 rounded-xl text-xs font-mono bg-emerald-600 hover:bg-emerald-500 text-white font-semibold transition-colors">
                  Proceed to Exam Lab Quiz →
                </button>
              `}
            </div>
          </div>
        `;
      }

      function renderQuizView() {
        const stats = getOverallStats();
        return `
          <div class="space-y-6 fade-in">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <button id="back-dashboard-btn" type="button" class="inline-flex items-center gap-1.5 text-xs font-mono text-slate-500 dark:text-zinc-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
                <span>←</span>
                <span>Back to Dashboard</span>
              </button>
              <button id="reset-quiz-btn" type="button" class="px-3 py-1.5 rounded-lg text-xs font-mono bg-white dark:bg-surface-card hover:border-rose-500/40 border border-slate-200 dark:border-surface-border text-slate-600 dark:text-zinc-300 transition-colors">
                Reset Quiz Answers
              </button>
            </div>

            <!-- Quiz Header -->
            <div class="p-6 rounded-2xl bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="text-xs font-mono font-semibold text-emerald-600 dark:text-emerald-400 mb-1">EXAM LAB · SELF-ASSESSMENT</div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-zinc-100">Malaysian Written Law Quiz</h1>
                <p class="text-xs text-slate-500 dark:text-zinc-400 mt-1">Select an option to verify your answer and review the constitutional or statutory authority.</p>
              </div>
              <div class="px-4 py-3 rounded-xl bg-slate-50 dark:bg-surface-elevated border border-slate-200 dark:border-surface-border text-center shrink-0">
                <div class="text-[10px] font-mono text-slate-500 dark:text-zinc-400">CURRENT SCORE</div>
                <div class="text-xl font-mono font-bold text-emerald-600 dark:text-emerald-400">${stats.quizCorrect} / ${QUIZ_QUESTIONS.length}</div>
              </div>
            </div>

            <!-- Questions List -->
            <div class="space-y-4">
              ${QUIZ_QUESTIONS.map((item, qIdx) => {
                const chosen = state.quizAnswers[qIdx];
                const hasAnswered = chosen !== undefined;
                return `
                  <div class="p-6 rounded-2xl bg-white dark:bg-surface-card border border-slate-200 dark:border-surface-border">
                    <div class="text-xs font-mono text-slate-400 dark:text-zinc-500 mb-2">QUESTION 0${qIdx + 1}</div>
                    <h3 class="text-sm sm:text-base font-semibold text-slate-900 dark:text-zinc-100 mb-4">${item.q}</h3>
                    <div class="space-y-2">
                      ${item.options.map((opt, oIdx) => {
                        let btnStyle = 'bg-slate-50 dark:bg-surface-elevated border-slate-200 dark:border-surface-border text-slate-700 dark:text-zinc-300 hover:border-emerald-500/40';
                        let marker = String.fromCharCode(65 + oIdx);
                        if (hasAnswered) {
                          if (oIdx === item.answer) {
                            btnStyle = 'bg-emerald-500/15 border-emerald-500/50 text-emerald-800 dark:text-emerald-200 font-medium';
                            marker = '✓';
                          } else if (oIdx === chosen) {
                            btnStyle = 'bg-rose-500/15 border-rose-500/50 text-rose-800 dark:text-rose-200';
                            marker = '✕';
                          } else {
                            btnStyle = 'bg-slate-50/60 dark:bg-surface-elevated/40 border-slate-200/60 dark:border-surface-border/60 text-slate-400 dark:text-zinc-500';
                          }
                        }
                        return `
                          <button type="button" data-q="${qIdx}" data-opt="${oIdx}" class="quiz-opt-btn w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm flex items-center gap-3 transition-colors ${btnStyle}">
                            <span class="w-6 h-6 rounded-md font-mono text-xs flex items-center justify-center bg-white/80 dark:bg-surface-dark/80 border border-current/20 shrink-0">${marker}</span>
                            <span>${opt}</span>
                          </button>
                        `;
                      }).join('')}
                    </div>
                    ${hasAnswered ? `
                      <div class="mt-4 p-3.5 rounded-xl bg-slate-50 dark:bg-surface-elevated border border-slate-200 dark:border-surface-border text-xs text-slate-600 dark:text-zinc-300">
                        <strong class="font-mono text-emerald-600 dark:text-emerald-400">LEGAL AUTHORITY:</strong> ${item.explanation}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // =========================================================================
      // 7. MAIN RENDER & EVENT BINDING
      // =========================================================================
      function render() {
        const root = document.getElementById('app-root');
        if (!root) return;

        if (state.currentView === 'module') {
          root.innerHTML = renderModuleView();
        } else if (state.currentView === 'quiz') {
          root.innerHTML = renderQuizView();
        } else {
          root.innerHTML = renderDashboard();
        }

        bindDynamicEvents();
      }

      function bindDynamicEvents() {
        const nextTipBtn = document.getElementById('next-tip-btn');
        if (nextTipBtn) {
          nextTipBtn.addEventListener('click', () => {
            state.tipIndex = (state.tipIndex + 1) % STUDY_TIPS.length;
            render();
          });
        }

        const toggleMilestonesBtn = document.getElementById('toggle-milestones-btn');
        if (toggleMilestonesBtn) {
          toggleMilestonesBtn.addEventListener('click', () => {
            state.showAllMilestones = !state.showAllMilestones;
            render();
          });
        }

        document.querySelectorAll('.milestone-card').forEach(card => {
          card.addEventListener('click', () => {
            const view = card.getAttribute('data-nav-view');
            const mod = card.getAttribute('data-nav-mod');
            navigateTo(view, mod);
          });
        });

        document.querySelectorAll('.module-card').forEach(card => {
          card.addEventListener('click', () => {
            const modId = card.getAttribute('data-open-module');
            navigateTo('module', modId);
          });
        });

        const openQuizCard = document.getElementById('open-quiz-card');
        if (openQuizCard) {
          openQuizCard.addEventListener('click', () => navigateTo('quiz'));
        }

        const backDashBtn = document.getElementById('back-dashboard-btn');
        if (backDashBtn) {
          backDashBtn.addEventListener('click', () => navigateTo('dashboard'));
        }

        document.querySelectorAll('.switch-mod-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const modId = btn.getAttribute('data-switch-mod');
            navigateTo('module', modId);
          });
        });

        document.querySelectorAll('.toggle-sec-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-toggle-sec');
            toggleSectionComplete(key);
          });
        });

        const goExamLabBtn = document.getElementById('go-exam-lab-btn');
        if (goExamLabBtn) {
          goExamLabBtn.addEventListener('click', () => navigateTo('quiz'));
        }

        const resetQuizBtn = document.getElementById('reset-quiz-btn');
        if (resetQuizBtn) {
          resetQuizBtn.addEventListener('click', resetQuiz);
        }

        document.querySelectorAll('.quiz-opt-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const qIdx = Number(btn.getAttribute('data-q'));
            const optIdx = Number(btn.getAttribute('data-opt'));
            answerQuiz(qIdx, optIdx);
          });
        });
      }

      // Static Header, Footer & Global Keyboard Bindings
      document.getElementById('brand-home-btn').addEventListener('click', () => navigateTo('dashboard'));
      document.getElementById('open-search-btn').addEventListener('click', openCommandModal);
      document.getElementById('close-search-btn').addEventListener('click', closeCommandModal);
      document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);
      document.getElementById('reset-progress-btn').addEventListener('click', resetProgress);

      document.getElementById('command-input').addEventListener('input', (e) => {
        filterCommandList(e.target.value);
      });

      document.getElementById('command-modal').addEventListener('click', (e) => {
        if (e.target.id === 'command-modal') {
          closeCommandModal();
        }
      });

      document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('command-modal');
        const isOpen = modal && !modal.classList.contains('hidden');
        const activeTag = document.activeElement ? document.activeElement.tagName : '';

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          isOpen ? closeCommandModal() : openCommandModal();
        } else if (e.key === '/' && !isOpen && activeTag !== 'INPUT' && activeTag !== 'TEXTAREA') {
          e.preventDefault();
          openCommandModal();
        } else if (e.key === 'Escape' && isOpen) {
          closeCommandModal();
        }
      });

      // Boot Application
      initTheme();
      render();
    })();
  </script>
</body>
</html>
